<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB700;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Fondo negro con brillo -->
  <rect width="128" height="128" fill="#000000"/>
  <circle cx="64" cy="64" r="64" fill="url(#glowGrad)"/>
  
  <!-- Estrella de 8 puntas estilo Star Wars -->
  <g transform="translate(64, 64)">
    <!-- Rayos principales -->
    <path d="M 0,-40 L 3,-15 L 0,-18 L -3,-15 Z" fill="url(#goldGrad)"/>
    <path d="M 0,40 L 3,15 L 0,18 L -3,15 Z" fill="url(#goldGrad)"/>
    <path d="M -40,0 L -15,3 L -18,0 L -15,-3 Z" fill="url(#goldGrad)"/>
    <path d="M 40,0 L 15,3 L 18,0 L 15,-3 Z" fill="url(#goldGrad)"/>
    
    <!-- Rayos diagonales -->
    <path d="M -28,-28 L -12,-12 L -14,-10 L -10,-14 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 28,-28 L 12,-12 L 10,-14 L 14,-10 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M -28,28 L -12,12 L -10,14 L -14,10 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 28,28 L 12,12 L 14,10 L 10,14 Z" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Círculo central dorado -->
    <circle cx="0" cy="0" r="22" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="18" fill="#000000"/>
    
    <!-- Letra B estilizada en el centro -->
    <text x="0" y="10" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFD700" text-anchor="middle" style="font-weight: 900; letter-spacing: -2px;">B</text>
  </g>
  
  <!-- Borde sutil -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
</svg>
